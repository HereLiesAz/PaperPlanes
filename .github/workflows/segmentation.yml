name: PaperPlanes Segmentation Pipeline

on:
  push:
    paths:
      - 'inbox/**'
  workflow_dispatch:

jobs:
  remove_background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pillow numpy rembg[cli]
      - run: python pipeline.py remove_bg
      - uses: actions/upload-artifact@v4
        with:
          name: subject-mask
          path: workspace/subject_mask.png

  generate_image:
    needs: remove_background
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install torch diffusers transformers accelerate pillow numpy
      - run: python pipeline.py generate
      - uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: workspace/generated_image.png

  align_images:
    needs: generate_image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: generated-image
          path: workspace/
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install opencv-python-headless numpy pillow
      - run: python pipeline.py align
      - uses: actions/upload-artifact@v4
        with:
          name: aligned-image
          path: workspace/aligned_image.png

  extract_depth:
    needs: align_images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: aligned-image
          path: workspace/
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install torch transformers pillow numpy
      - run: python pipeline.py depth
      - uses: actions/upload-artifact@v4
        with:
          name: depth-map
          path: workspace/depth_map.npy

  segment_layers:
    needs: extract_depth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: subject-mask
          path: workspace/
      - uses: actions/download-artifact@v4
        with:
          name: depth-map
          path: workspace/
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install opencv-python-headless numpy pillow
      - run: python pipeline.py segment
      - name: Commit Output
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add paper_planes_layers.zip
          git commit -m "Add generated layers" || echo "No changes to commit"
          git push
