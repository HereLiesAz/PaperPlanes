name: PaperPlanes Wizard Pipeline

on:
  repository_dispatch:
    types: [pipeline_trigger]

# Only allow one pipeline operation at a time to prevent repo corruption
concurrency:
  group: paperplanes-sync
  cancel-in-progress: false

jobs:
  execute_step:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reality
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Base Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless

      - name: Conditional AI Dependencies
        if: github.event.client_payload.job == 'generate' || github.event.client_payload.job == 'depth'
        run: |
          pip install torch diffusers transformers accelerate google-generativeai

      - name: Execute Pipeline Job
        env:
          TARGET_LAYERS: ${{ github.event.client_payload.layers || '6' }}
          MANUAL_COORDS: ${{ github.event.client_payload.coords || '' }}
          CUSTOM_PROMPT: ${{ github.event.client_payload.prompt || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p workspace
          python pipeline.py ${{ github.event.client_payload.job }}

      - name: Atomic Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add workspace/* || true
          git add paper_planes_layers.zip || true
          # Rebase is critical here to ensure we don't drift from main during long AI runs
          git pull --rebase origin main
          git commit -m "Step complete: ${{ github.event.client_payload.job }}" || echo "No changes"
          git push origin main
