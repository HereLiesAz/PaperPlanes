name: PaperPlanes Wizard Pipeline

on:
  repository_dispatch:
    types: [pipeline_trigger]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  execute_step:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reality
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch diffusers transformers accelerate pillow numpy opencv-python-headless rembg[cli]

      - name: Execute Pipeline Job
        env:
          TARGET_LAYERS: ${{ github.event.client_payload.layers || '6' }}
          MANUAL_COORDS: ${{ github.event.client_payload.coords || '' }}
          CUSTOM_PROMPT: ${{ github.event.client_payload.prompt || '' }}
        run: |
          mkdir -p workspace
          python pipeline.py ${{ github.event.client_payload.job }}

      - name: Commit and Push Artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add workspace/* || true
          git add paper_planes_layers.zip || true
          git commit -m "Automated artifact generation for step: ${{ github.event.client_payload.job }}" || echo "No artifacts changed or generated."
          git pull --rebase origin main || true
          git push
