name: Distributed Vivisection Pipeline

on:
  push:
    paths:
      - 'inbox/**'
  workflow_dispatch:

jobs:
  remove_background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pillow numpy rembg[cli]
      - run: python pipeline.py remove_bg
      - uses: actions/upload-artifact@v4
        with:
          name: subject-mask
          path: workspace/subject_mask.png

  generate_hallucination:
    needs: remove_background
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install torch diffusers transformers accelerate pillow numpy
      - run: python pipeline.py generate
      - uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: workspace/generated_hallucination.png

  align_images:
    needs: generate_hallucination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: generated-image
          path: workspace/
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install opencv-python-headless numpy pillow
      - run: python pipeline.py align
      - uses: actions/upload-artifact@v4
        with:
          name: aligned-image
          path: workspace/aligned_generated.png

  generate_depth:
    needs: align_images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: aligned-image
          path: workspace/
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install torch transformers pillow numpy
      - run: python pipeline.py depth
      - uses: actions/upload-artifact@v4
        with:
          name: depth-array
          path: workspace/raw_depth.npy

  segment_layers:
    needs: generate_depth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: subject-mask
          path: workspace/
      - uses: actions/download-artifact@v4
        with:
          name: depth-array
          path: workspace/
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install opencv-python-headless numpy pillow
      - run: python pipeline.py segment
      - name: Commit Extracted Strata
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "The Butcher"
          git add paper_planes_strata.zip
          git commit -m "Strata extracted via distributed pipeline" || echo "No changes"
          git push
