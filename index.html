<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Planes</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            color: #fff; 
            font-family: monospace; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        #controls { 
            padding: 15px; 
            z-index: 10; 
            position: absolute; 
            top: 0; 
            left: 0; 
            background: rgba(0,0,0,0.85); 
            border-bottom-right-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 300px;
        }
        input, button {
            background: #222; 
            color: #fff; 
            border: 1px solid #555;
            padding: 5px;
            font-family: monospace;
        }
        button { cursor: pointer; background: #333; }
        button:hover { background: #555; }
        #status { 
            color: #ff3333; 
            font-weight: bold;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label>GitHub PAT (repo scope):<br><input type="password" id="ghToken" style="width:100%;"></label>
        <label>Repo (Owner/Name):<br><input type="text" id="ghRepo" placeholder="HereLiesAz/paper-planes" style="width:100%;"></label>
        <label>Strata: <input type="number" id="numLayers" value="6" min="2" max="256" style="width:50px; background:#222; color:#fff; border:1px solid #555;"></label>
        <input type="file" id="upload" accept="image/*">
        <button id="executeBtn">Send to the Slaughterhouse</button>
        <div id="status">Awaiting victim...</div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
