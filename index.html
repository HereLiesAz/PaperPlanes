<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPlanes Wizard</title>
    <style>
        :root { --bg: #0a0a0a; --fg: #d4d4d4; --accent: #00ff41; }
        body { background: var(--bg); color: var(--fg); font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; border: 1px solid #333; padding: 20px; }
        .status-box { background: #1a1a1a; padding: 10px; margin-bottom: 20px; border-left: 4px solid var(--accent); }
        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .preview-item { border: 1px solid #333; padding: 10px; text-align: center; background: #000; }
        .preview-item img { max-width: 100%; height: auto; border: 1px solid #222; margin-top: 10px; }
        .loading-shimmer { color: #555; font-style: italic; padding: 40px 0; }
        button { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 10px 20px; cursor: pointer; }
        button:hover { background: var(--accent); color: #000; }
        input, textarea { background: #111; border: 1px solid #333; color: #fff; padding: 8px; width: 100%; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>PaperPlanes Wizard</h2>
        
        <div id="status" class="status-box">Ready.</div>

        <div>
            <input type="file" id="fileInput" accept="image/*"><br><br>
            <button onclick="startPipeline()">1. Upload & Crop</button>
        </div>

        <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">

        <div>
            <textarea id="promptInput" placeholder="Enter transformation prompt... (e.g., 'Turn this into a high-res photo')"></textarea><br><br>
            <button onclick="triggerJob('generate')">2. Generate Hallucination</button>
            <button onclick="triggerJob('depth')">3. Extract Depth Map</button>
        </div>

        <div class="preview-grid" id="previews">
            <div class="preview-item">
                <strong>Cropped Source</strong>
                <div id="crop-container" class="loading-shimmer">Awaiting data...</div>
            </div>
            <div class="preview-item">
                <strong>AI Generation</strong>
                <div id="gen-container" class="loading-shimmer">Awaiting data...</div>
            </div>
            <div class="preview-item">
                <strong>Raw Depth Map</strong>
                <div id="depth-container" class="loading-shimmer">Awaiting data...</div>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "YOUR_CLOUDFLARE_WORKER_URL"; 

        async function startPipeline() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Select a file.");
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                updateStatus("Uploading to GitHub...");
                
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        path: `inbox/${file.name}`,
                        content: base64,
                        message: `Upload ${file.name}`,
                        job: 'crop'
                    })
                });
                
                if (res.ok) {
                    updateStatus("Job triggered. Polling for results...");
                    startPolling();
                }
            };
            reader.readAsDataURL(file);
        }

        async function triggerJob(jobName) {
            updateStatus(`Triggering ${jobName}...`);
            const prompt = document.getElementById('promptInput').value;
            
            await fetch(WORKER_URL, {
                method: 'POST',
                body: JSON.stringify({
                    path: 'trigger.json',
                    content: btoa(JSON.stringify({ triggered: true, time: Date.now() })),
                    message: `Manual trigger: ${jobName}`,
                    job: jobName,
                    prompt: prompt
                })
            });
            startPolling();
        }

        function updateStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        let pollInterval;
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                const res = await fetch(WORKER_URL);
                const data = await res.json();
                
                updateStatus(`Action: ${data.status || 'unknown'} (${data.conclusion || 'running'})`);

                // ONLY render images if the conclusion is 'success'
                if (data.conclusion === 'success') {
                    renderImage('crop-container', data.artifacts.output);
                    renderImage('gen-container', data.artifacts.photo);
                    renderImage('depth-container', data.artifacts.depth);
                    clearInterval(pollInterval);
                } else if (data.status === 'in_progress' || data.status === 'queued') {
                    setLoading('crop-container');
                    setLoading('gen-container');
                    setLoading('depth-container');
                }
            }, 5000);
        }

        function setLoading(id) {
            document.getElementById(id).innerHTML = `<div class="loading-shimmer">Action running...</div>`;
        }

        function renderImage(id, url) {
            const container = document.getElementById(id);
            // Check if we already have this image to avoid flicker
            if (container.querySelector('img') && container.querySelector('img').src === url) return;
            
            container.innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='<div class=loading-shimmer>File syncing...</div>'">`;
        }
    </script>
</body>
</html>
