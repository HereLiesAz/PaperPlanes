<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPlanes</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #121212; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 2rem; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .tabs { display: flex; width: 100%; max-width: 800px; margin-bottom: 1rem; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 1rem; background: #1a1a1a; color: #888; border: none; cursor: pointer; font-weight: bold; }
        .tab-btn.active { color: #fff; background: #1e1e1e; border-bottom: 2px solid #007bff; }
        .tab-content { display: none; width: 100%; max-width: 800px; }
        .tab-content.active { display: block; }
        .container { background: #1e1e1e; border: 1px solid #333; padding: 2rem; border-radius: 8px; width: 100%; box-sizing: border-box; }
        button.action-btn { width: 100%; padding: 1rem; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .terminal-container { width: 100%; background: #000; border: 1px solid #333; border-radius: 8px; margin-top: 1rem; }
        .term-header { background: #1a1a1a; padding: 0.5rem 1rem; font-family: monospace; font-size: 0.8rem; color: #888; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        #terminal { height: 250px; overflow-y: auto; padding: 1rem; font-family: monospace; font-size: 0.85rem; color: #00ff00; }
        .step-overlay { display: none; background: #252525; padding: 1.5rem; border: 1px solid #444; border-radius: 8px; margin-top: 1rem; text-align: center; }
        #approval-preview, #cropCanvas { max-width: 100%; border: 1px solid #555; margin: 10px 0; }
        input[type="text"] { width: 100%; padding: 0.8rem; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" data-target="pipeline-tab">PIPELINE WIZARD</button>
        <button class="tab-btn" data-target="realigner-tab">REALIGNER</button>
    </div>

    <div id="pipeline-tab" class="tab-content active">
        <div class="container" id="init-ui">
            <input type="file" id="sourceInput" accept="image/*"><br><br>
            <label>Layers: <span id="layerDisplay">6</span></label>
            <input type="range" id="layersInput" min="2" max="12" value="6"><br><br>
            <button id="processBtn" class="action-btn">BEGIN PIPELINE</button>
        </div>

        <div class="terminal-container">
            <div class="term-header"><span>LOG</span><span id="terminalStatus">IDLE</span></div>
            <div id="terminal"></div>
        </div>

        <div id="approval-ui" class="step-overlay">
            <h2 id="approval-title">Approval Required</h2>
            <img id="approval-preview" src="">
            <div style="display: flex; gap: 10px;">
                <button id="btn-approve" class="action-btn" style="background: #28a745">APPROVE</button>
                <button id="btn-reject" class="action-btn" style="background: #dc3545">REJECT</button>
            </div>
        </div>

        <div id="manual-crop-ui" class="step-overlay">
            <h2>MANUAL CROP</h2>
            <canvas id="cropCanvas"></canvas>
            <button id="btn-submit-crop" class="action-btn">SUBMIT WARP</button>
        </div>

        <div id="manual-prompt-ui" class="step-overlay">
            <h2>NEW PROMPT</h2>
            <input type="text" id="customPromptInput" placeholder="Enter new prompt...">
            <button id="btn-submit-prompt" class="action-btn">RE-GENERATE</button>
        </div>
    </div>

    <div id="realigner-tab" class="tab-content">
        <div class="container">
            <label>Base <input type="file" id="baseUpload"></label>
            <label>Depth <input type="file" id="depthUpload"></label>
            <canvas id="canvas" style="width:100%"></canvas>
            <button id="exportBtn" class="action-btn">EXPORT</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
