<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPlanes</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #007bff; --terminal-green: #00ff00; --error-red: #ff4444; }
        body { background: var(--bg); color: #e0e0e0; font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem; box-sizing: border-box; }
        
        .tabs { display: flex; width: 100%; max-width: 800px; margin-bottom: 1.5rem; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 1rem; background: #1a1a1a; color: #888; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { color: #fff; background: var(--panel); border-bottom: 2px solid var(--accent); }
        
        .tab-content { display: none; width: 100%; max-width: 800px; flex-direction: column; }
        .tab-content.active { display: flex; }

        .container { background: var(--panel); border: 1px solid #333; padding: 2rem; border-radius: 8px; width: 100%; box-sizing: border-box; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; margin: 0 0 1.5rem 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }

        .input-group { margin-bottom: 1rem; background: #252525; padding: 1rem; border-radius: 4px; border: 1px solid #444; }
        label { display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.85rem; }

        button.action-btn { width: 100%; padding: 1rem; background: var(--accent); color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button.action-btn:hover { background: #0056b3; }

        /* Terminal - Hidden by default */
        #terminal-wrapper { display: none; width: 100%; background: #000; border: 1px solid #333; border-radius: 8px; overflow: hidden; margin-top: 1.5rem; }
        .term-header { background: #1a1a1a; padding: 0.5rem 1rem; font-family: monospace; font-size: 0.75rem; color: #666; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        #terminal { height: 250px; overflow-y: auto; padding: 1rem; font-family: monospace; font-size: 0.85rem; line-height: 1.4; color: var(--terminal-green); }

        /* Step-specific UI - Hidden by default */
        .step-overlay { display: none; background: #252525; border: 1px solid #444; border-radius: 8px; padding: 1.5rem; margin-top: 1.5rem; text-align: center; width: 100%; box-sizing: border-box; }
        .artifact-preview { max-width: 100%; border: 1px solid #555; border-radius: 4px; margin: 1rem 0; background: #000; }
        
        #cropCanvas { max-width: 100%; border: 1px solid var(--accent); border-radius: 4px; cursor: crosshair; touch-action: none; background: #000; }
        input[type="text"] { width: 100%; padding: 0.8rem; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; font-family: monospace; }

        .realigner-layout { display: flex; gap: 20px; }
        .controls { flex: 0 0 280px; display: flex; flex-direction: column; gap: 12px; }
        .preview-canvas-area { flex-grow: 1; background: #000; border-radius: 8px; display: flex; justify-content: center; align-items: flex-start; border: 1px solid #333; min-height: 400px; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" data-target="pipeline-tab">PIPELINE WIZARD</button>
        <button class="tab-btn" data-target="realigner-tab">REALIGNER</button>
    </div>

    <div id="pipeline-tab" class="tab-content active">
        <div class="container" id="init-ui">
            <h1>PAPERPLANES: INITIATE</h1>
            <div class="input-group">
                <label>Source Image</label>
                <input type="file" id="sourceInput" accept="image/*">
            </div>
            <div class="input-group">
                <label>Target Strata: <span id="layerDisplay">6</span></label>
                <input type="range" id="layersInput" min="2" max="12" value="6">
            </div>
            <button id="processBtn" class="action-btn">EXECUTE SEQUENTIAL FLOW</button>
        </div>

        <div id="terminal-wrapper">
            <div class="term-header">
                <span>PIPELINE_TELEMETRY</span>
                <span id="terminalStatus">IDLE</span>
            </div>
            <div id="terminal"></div>
        </div>

        <div id="approval-ui" class="step-overlay">
            <h2 id="approval-title" style="margin-top:0">Validation Required</h2>
            <img id="approval-preview" class="artifact-preview" src="" alt="Artifact">
            <div style="display: flex; gap: 10px;">
                <button id="btn-approve" class="action-btn" style="background: #28a745">APPROVE</button>
                <button id="btn-reject" class="action-btn" style="background: var(--error-red)">REJECT / OVERRIDE</button>
            </div>
        </div>

        <div id="manual-crop-ui" class="step-overlay">
            <h1>MANUAL VECTOR OVERRIDE</h1>
            <canvas id="cropCanvas"></canvas>
            <button id="btn-submit-crop" class="action-btn">WARP & INJECT</button>
        </div>

        <div id="manual-prompt-ui" class="step-overlay">
            <h1>SEMANTIC RECONSTRUCTION</h1>
            <input type="text" id="customPromptInput" placeholder="Enter reconstruction directive...">
            <button id="btn-submit-prompt" class="action-btn" style="background: #ffaa00; color: #000;">FORCE HALLUCINATION</button>
        </div>
    </div>

    <div id="realigner-tab" class="tab-content">
        <div class="container">
            <div class="realigner-layout">
                <div class="controls">
                    <h1>ALIGNMENT</h1>
                    <label>Base <input type="file" id="baseUpload" accept="image/*"></label>
                    <label>Depth <input type="file" id="depthUpload" accept="image/*"></label>
                    <label>X: <span id="xVal">0</span> <input type="range" id="x" min="-1000" max="1000" value="0"></label>
                    <label>Y: <span id="yVal">0</span> <input type="range" id="y" min="-1000" max="1000" value="0"></label>
                    <label>Scale: <span id="scaleVal">100</span> <input type="range" id="scale" min="10" max="1000" value="100"></label>
                    <label>Rot: <span id="rotVal">0</span> <input type="range" id="rot" min="-180" max="180" value="0"></label>
                    <label>Opacity: <span id="opVal">50</span> <input type="range" id="op" min="0" max="100" value="50"></label>
                    <button id="exportBtn" class="action-btn">FINALIZE ALIGNMENT</button>
                </div>
                <div class="preview-canvas-area"><canvas id="canvas"></canvas></div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
