<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Planes</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #1a1a1a;
            --border: #333;
            --accent: #007bff;
            --success: #00ff00;
            --text: #d0d0d0;
            --layer-shadow: 10px 10px 20px rgba(0,0,0,0.8);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: monospace;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s, visibility 1s;
        }

        #splash h1 { color: #fff; letter-spacing: 10px; }

        .stage {
            width: 100%;
            max-width: 800px;
            margin-top: 50px;
            padding: 20px;
        }

        .tabs { display: flex; gap: 5px; }

        .tab-btn {
            padding: 10px 20px;
            background: #222;
            color: #666;
            border: 1px solid var(--border);
            border-bottom: none;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--panel);
            color: #fff;
            border-color: var(--accent);
        }

        .container {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 30px;
            box-shadow: var(--layer-shadow);
            margin-bottom: 20px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .action-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        .terminal-wrap {
            background: #000;
            border: 1px solid var(--border);
            margin-top: 20px;
        }

        .term-head {
            background: #111;
            padding: 5px 10px;
            font-size: 12px;
            color: #555;
            display: flex;
            justify-content: space-between;
        }

        #terminal {
            height: 150px;
            padding: 10px;
            overflow-y: auto;
            color: var(--success);
            font-size: 13px;
        }

        .step-overlay {
            display: none;
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        #approval-preview, #cropCanvas {
            max-width: 100%;
            border: 2px solid #000;
            margin: 20px 0;
        }

        input[type="text"], input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div id="splash">
        <h1>PAPER PLANES</h1>
    </div>

    <div class="stage">
        <div class="tabs">
            <button class="tab-btn active" data-target="pipeline-tab">PIPELINE</button>
            <button class="tab-btn" data-target="realigner-tab">STUDIO</button>
        </div>

        <div id="pipeline-tab" class="tab-content active">
            <div class="container" id="init-ui">
                <label>FILE</label>
                <input type="file" id="sourceInput" accept="image/*">
                
                <label>LAYERS: <span id="layerDisplay">6</span></label>
                <input type="range" id="layersInput" min="2" max="12" value="6">
                
                <button id="processBtn" class="action-btn">START</button>
            </div>

            <div class="terminal-wrap">
                <div class="term-head"><span>LOG</span><span id="terminalStatus">IDLE</span></div>
                <div id="terminal"></div>
            </div>

            <div id="approval-ui" class="step-overlay">
                <h2>PREVIEW</h2>
                <img id="approval-preview" src="">
                <div style="display: flex; gap: 10px;">
                    <button id="btn-approve" class="action-btn">APPROVE</button>
                    <button id="btn-reject" class="action-btn" style="background: #555;">REJECT</button>
                </div>
            </div>

            <div id="manual-crop-ui" class="step-overlay">
                <h2>CROP</h2>
                <canvas id="cropCanvas"></canvas>
                <button id="btn-submit-crop" class="action-btn">SUBMIT</button>
            </div>

            <div id="manual-prompt-ui" class="step-overlay">
                <h2>PROMPT</h2>
                <input type="text" id="customPromptInput">
                <button id="btn-submit-prompt" class="action-btn">REGENERATE</button>
            </div>
        </div>

        <div id="realigner-tab" class="tab-content">
            <div class="container">
                <input type="file" id="baseUpload">
                <input type="file" id="depthUpload">
                <canvas id="canvas" style="width:100%; height: 300px; background:#000; margin-top:10px;"></canvas>
                <button id="exportBtn" class="action-btn">EXPORT</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
