<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Planes | Deconstruction Suite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #161616;
            --border: #333;
            --accent: #007bff;
            --success: #00ff00;
            --error: #ff4444;
            --text: #c0c0c0;
            --shadow: 6px 6px 0px #000;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* The Splash Screen: A Dramatic Prelude */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease-out, visibility 1.5s;
        }

        #splash h1 {
            font-size: 3rem;
            letter-spacing: 0.5rem;
            margin-bottom: 0;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        #splash p {
            font-size: 0.8rem;
            color: #666;
            margin-top: 1rem;
            text-transform: uppercase;
        }

        /* The Stage: Paper Theater Layout */
        .stage-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            z-index: 10;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: -1px; /* Overlap for the paper-tab effect */
            position: relative;
            z-index: 20;
        }

        .tab-btn {
            padding: 0.8rem 1.5rem;
            background: var(--panel);
            color: #666;
            border: 2px solid var(--border);
            border-bottom: none;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.2s;
            box-shadow: 3px 0 0 #000;
        }

        .tab-btn.active {
            color: #fff;
            background: var(--panel);
            border-color: var(--accent);
            padding-top: 1rem;
            margin-top: -0.2rem;
            box-shadow: 4px -2px 0 var(--accent);
        }

        .tab-content {
            display: none;
            width: 100%;
        }

        .tab-content.active {
            display: block;
            animation: layerIn 0.4s ease-out;
        }

        .container {
            background: var(--panel);
            border: 2px solid var(--border);
            padding: 2.5rem;
            box-sizing: border-box;
            box-shadow: var(--shadow);
            position: relative;
        }

        /* Stratification aesthetic: Simulated stacked paper */
        .container::after {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: -10px; bottom: -10px;
            border: 1px solid #1a1a1a;
            z-index: -1;
            pointer-events: none;
        }

        button.action-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--accent);
            color: #fff;
            border: 2px solid #000;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            margin-top: 15px;
            box-shadow: 4px 4px 0 #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button.action-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        .terminal-container {
            width: 100%;
            background: #000;
            border: 2px solid var(--border);
            margin-top: 1.5rem;
            box-shadow: var(--shadow);
        }

        .term-header {
            background: #111;
            padding: 0.6rem 1rem;
            font-size: 0.75rem;
            color: #444;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        #terminal {
            height: 200px;
            overflow-y: auto;
            padding: 1rem;
            font-size: 0.85rem;
            color: var(--success);
            line-height: 1.4;
        }

        .step-overlay {
            display: none;
            background: #1a1a1a;
            padding: 2rem;
            border: 2px solid #444;
            margin-top: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        #approval-preview, #cropCanvas {
            max-width: 100%;
            border: 3px solid #000;
            margin: 20px 0;
            background: #000;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem;
            background: #050505;
            border: 2px solid var(--border);
            color: #fff;
            font-family: inherit;
            box-sizing: border-box;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            margin: 1rem 0;
        }

        @keyframes layerIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        label { color: #888; font-size: 0.8rem; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="splash">
        <h1>PAPER PLANES</h1>
        <p>A Sequential Deconstruction of Reality</p>
    </div>

    <div class="stage-container">
        <div class="tabs">
            <button class="tab-btn active" data-target="pipeline-tab">PIPELINE WIZARD</button>
            <button class="tab-btn" data-target="realigner-tab">REALIGNER</button>
        </div>

        <div id="pipeline-tab" class="tab-content active">
            <div class="container" id="init-ui">
                <label>Source Ingestion</label><br>
                <input type="file" id="sourceInput" accept="image/*" style="margin: 1rem 0;"><br>
                
                <label>Strata Count: <span id="layerDisplay" style="color:var(--accent)">6</span></label>
                <input type="range" id="layersInput" min="2" max="12" value="6">
                
                <button id="processBtn" class="action-btn">FOLD REALITY (BEGIN)</button>
            </div>

            <div class="terminal-container">
                <div class="term-header"><span>TELEMETRY_LOG</span><span id="terminalStatus">IDLE</span></div>
                <div id="terminal"></div>
            </div>

            <div id="approval-ui" class="step-overlay">
                <h2 id="approval-title">The Oracle Speaks</h2>
                <img id="approval-preview" src="">
                <div style="display: flex; gap: 10px;">
                    <button id="btn-approve" class="action-btn" style="background: var(--success); color: #000">ACCEPT FATE</button>
                    <button id="btn-reject" class="action-btn" style="background: var(--error)">REJECT MANIFESTATION</button>
                </div>
            </div>

            <div id="manual-crop-ui" class="step-overlay">
                <h2>MANUAL CROP OVERRIDE</h2>
                <canvas id="cropCanvas"></canvas>
                <button id="btn-submit-crop" class="action-btn">CONFIRM GEOMETRY</button>
            </div>

            <div id="manual-prompt-ui" class="step-overlay">
                <h2>SEMANTIC RECONSTRUCTION</h2>
                <input type="text" id="customPromptInput" placeholder="Direct the machine's eye...">
                <button id="btn-submit-prompt" class="action-btn">RE-GENERATE HALLUCINATION</button>
            </div>
        </div>

        <div id="realigner-tab" class="tab-content">
            <div class="container">
                <h2>STRATA STUDIO</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div>
                        <label>Base Layer</label>
                        <input type="file" id="baseUpload">
                    </div>
                    <div>
                        <label>Depth Map</label>
                        <input type="file" id="depthUpload">
                    </div>
                </div>
                <canvas id="canvas" style="width:100%; background:#000; border: 2px solid #000;"></canvas>
                <button id="exportBtn" class="action-btn">EXPORT ZIP PACKAGE</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
