<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPlanes | Strata Theater</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #1a1a1a;
            --border: #333;
            --accent: #007bff;
            --success: #00ff00;
            --text: #d0d0d0;
            /* Tactile Paper Shadows */
            --layer-shadow: 12px 12px 0px rgba(0,0,0,0.8);
            --inner-shadow: inset 4px 4px 10px rgba(0,0,0,0.5);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- THE SPLASH SCREEN --- */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.5s;
        }

        .splash-frame {
            border: 2px solid #222;
            padding: 3rem;
            position: relative;
            background: #050505;
            box-shadow: 0 0 50px rgba(255,255,255,0.05);
        }

        .splash-frame::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 1px solid #111;
        }

        #splash h1 {
            font-size: 2.5rem;
            letter-spacing: 0.8rem;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
        }

        #splash .sub {
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 0.3rem;
            margin-top: 1rem;
            text-transform: uppercase;
        }

        /* --- THE THEATER STAGE --- */
        .stage {
            width: 100%;
            max-width: 900px;
            margin-top: 4rem;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* Physical Tab Layering */
        .tabs {
            display: flex;
            gap: 10px;
            padding-left: 20px;
        }

        .tab-btn {
            padding: 1rem 2rem;
            background: #222;
            color: #555;
            border: 2px solid var(--border);
            border-bottom: none;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            position: relative;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .tab-btn.active {
            background: var(--panel);
            color: #fff;
            padding-top: 1.2rem;
            margin-top: -0.2rem;
            z-index: 5;
            border-color: var(--accent);
            box-shadow: -5px -5px 0 rgba(0,0,0,0.5);
        }

        /* Main Container: The Stratified Panel */
        .container {
            background: var(--panel);
            border: 2px solid var(--border);
            padding: 3rem;
            position: relative;
            box-shadow: var(--layer-shadow);
            z-index: 4;
            margin-bottom: 2rem;
        }

        .container::after {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: -15px; bottom: -15px;
            border: 1px solid #111;
            background: rgba(255,255,255,0.01);
            z-index: -1;
            pointer-events: none;
        }

        .tab-content { display: none; width: 100%; }
        .tab-content.active { display: block; animation: paperSlide 0.5s ease-out; }

        @keyframes paperSlide {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Inputs and Buttons */
        input[type="file"] {
            width: 100%;
            padding: 1rem;
            background: #000;
            border: 1px dashed #444;
            color: #888;
            margin: 1.5rem 0;
            cursor: pointer;
        }

        .control-group { margin-bottom: 2rem; }

        label {
            display: block;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            background: #111;
            height: 4px;
            cursor: pointer;
        }

        .action-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--accent);
            color: #fff;
            border: none;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 6px 6px 0 #000;
            transition: transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .action-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0 #000;
        }

        /* Terminal Window */
        .terminal-wrap {
            margin-top: 2rem;
            background: #000;
            border: 2px solid #222;
            box-shadow: var(--layer-shadow);
        }

        .term-head {
            background: #111;
            padding: 8px 15px;
            font-size: 0.7rem;
            color: #444;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
        }

        #terminal {
            height: 200px;
            padding: 15px;
            overflow-y: auto;
            color: var(--success);
            font-size: 0.8rem;
            line-height: 1.5;
        }

        /* Step Overlays */
        .step-overlay {
            display: none;
            background: #151515;
            border: 2px solid #333;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: var(--layer-shadow);
            text-align: center;
        }

        h2 { font-size: 1.2rem; text-transform: uppercase; margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        #approval-preview, #cropCanvas { max-width: 100%; border: 5px solid #000; margin: 20px 0; background: #050505; }

        .btn-row { display: flex; gap: 15px; margin-top: 15px; }
        .success-btn { background: #1a1a1a; color: var(--success); border: 1px solid var(--success) !important; box-shadow: 4px 4px 0 var(--success); }
        .fail-btn { background: #1a1a1a; color: #ff4444; border: 1px solid #ff4444 !important; box-shadow: 4px 4px 0 #ff4444; }

    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-frame">
            <h1>PAPER PLANES</h1>
            <div class="sub">STRATIFIED DECONSTRUCTION v1.2</div>
        </div>
    </div>

    <div class="stage">
        <div class="tabs">
            <button class="tab-btn active" data-target="pipeline-tab">WIZARD</button>
            <button class="tab-btn" data-target="realigner-tab">STUDIO</button>
        </div>

        <div id="pipeline-tab" class="tab-content active">
            <div class="container" id="init-ui">
                <div class="control-group">
                    <label>Source Ingestion</label>
                    <input type="file" id="sourceInput" accept="image/*">
                </div>
                
                <div class="control-group">
                    <label>Deconstruction Layers: <span id="layerDisplay" style="color:var(--accent)">6</span></label>
                    <input type="range" id="layersInput" min="2" max="12" value="6">
                </div>
                
                <button id="processBtn" class="action-btn">Commence Folding</button>
            </div>

            <div class="terminal-wrap">
                <div class="term-head"><span>TELEMETRY_STREAM</span><span id="terminalStatus">IDLE</span></div>
                <div id="terminal"></div>
            </div>

            <div id="approval-ui" class="step-overlay">
                <h2 id="approval-title">Manifestation Result</h2>
                <img id="approval-preview" src="">
                <div class="btn-row">
                    <button id="btn-approve" class="action-btn success-btn">APPROVE</button>
                    <button id="btn-reject" class="action-btn fail-btn">REJECT</button>
                </div>
            </div>

            <div id="manual-crop-ui" class="step-overlay">
                <h2>Geometric Correction</h2>
                <canvas id="cropCanvas"></canvas>
                <button id="btn-submit-crop" class="action-btn">Set Vertices</button>
            </div>

            <div id="manual-prompt-ui" class="step-overlay">
                <h2>Semantic Injection</h2>
                <input type="text" id="customPromptInput" style="width:100%; padding:1rem; background:#000; border:1px solid #333; color:#fff;" placeholder="Direct the hallucination...">
                <button id="btn-submit-prompt" class="action-btn" style="margin-top:10px;">Re-Generate</button>
            </div>
        </div>

        <div id="realigner-tab" class="tab-content">
            <div class="container">
                <h2>Spatial Alignment</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div><label>Strata Base</label><input type="file" id="baseUpload"></div>
                    <div><label>Depth Map</label><input type="file" id="depthUpload"></div>
                </div>
                <canvas id="canvas" style="width:100%; height:400px; background:#000; margin: 20px 0;"></canvas>
                <button id="exportBtn" class="action-btn">Package Theater (.ZIP)</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
